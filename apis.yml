description: Eurac Research is a private research centre in Bolzano, Italy, working across alpine environment, earth
  observation, health and autonomy studies. Its MAPS portal publishes research datasets — snow cover, land use,
  climate and remote-sensing products for the Alpine region — through an OGC-standard GeoServer callable anonymously
  by any GIS client.
